<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Stock - Zapatos</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- Encabezado Superior -->
  <header class="app-header">
    <h1>Tienda Zapatos</h1>
    <span class="badge-status">Modo Pruebas (Local)</span>
  </header>

  <!-- Navegación Inferior (Barra Táctil) -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="navegar('ventas')">
      <span>🏷️</span> Ventas
    </button>
    <button class="nav-btn" onclick="navegar('compras')">
      <span>📦</span> Compras
    </button>
    <button class="nav-btn" onclick="navegar('stock')">
      <span>📊</span> Inventario
    </button>
  </nav>

  <!-- Contenedor Principal de Pantallas -->
  <main class="main-content">

    <!-- PANTALLA 1: VENTAS -->
    <section id="pantalla-ventas" class="pantalla active">
      <h2>Registrar Venta</h2>

      <!-- Filtro Rápido: Marca y Color -->
      <div class="filter-card">
        <div class="form-group">
          <label>Marca:</label>
          <select id="venta-filtro-marca" onchange="filtrarGaleriaVentas()">
            <option value="">-- Todas las Marcas --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Color:</label>
          <select id="venta-filtro-color" onchange="filtrarGaleriaVentas()">
            <option value="">-- Todos los Colores --</option>
          </select>
        </div>
        <button class="btn-secondary" onclick="resetFiltrosVentas()">Limpiar Filtros</button>
        <button class="btn-special" onclick="abrirVentaS000()">⚡ Venta Especial / Oferta (S000)</button>
      </div>

      <!-- Galería de Productos -->
      <h3>Catálogo Disponible</h3>
      <div id="galeria-ventas" class="grid-galeria">
        <!-- Tarjetas dinámicas generadas desde JS -->
      </div>
    </section>

    <!-- PANTALLA 2: COMPRAS (Registro post-tienda) -->
    <section id="pantalla-compras" class="pantalla">
      <h2>Registrar Entrada de Compras</h2>
      <p class="subtitle">Registra el lote traído del proveedor al retornar a tienda.</p>

      <div class="filter-card">
        <div class="form-group">
          <label>Buscar por Marca:</label>
          <select id="compra-filtro-marca" onchange="filtrarGaleriaCompras()">
            <option value="">-- Todas --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Buscar por Color:</label>
          <select id="compra-filtro-color" onchange="filtrarGaleriaCompras()">
            <option value="">-- Todos --</option>
          </select>
        </div>
        <button class="btn-primary" onclick="abrirFormularioNuevoProducto()">➕ Registrar Modelo Nuevo</button>
      </div>

      <h3>Seleccionar para Reposición</h3>
      <div id="galeria-compras" class="grid-galeria">
        <!-- Tarjetas dinámicas para reposición -->
      </div>
    </section>

    <!-- PANTALLA 3: INVENTARIO / CONSULTA -->
    <section id="pantalla-stock" class="pantalla">
      <h2>Consulta de Inventario</h2>
      <div class="search-box">
        <input type="text" id="input-buscar-stock" placeholder="Buscar por código, marca, color..." onkeyup="buscarEnStock()">
      </div>
      <div id="tabla-stock-container" class="table-responsive">
        <!-- Tabla generada dinámicamente -->
      </div>
    </section>

    <!-- MODAL DE PROCESAMIENTO (VENTA / REPOSICIÓN / NUEVO) -->
    <div id="modal-accion" class="modal-backdrop hidden">
      <div class="modal-content">
        <button class="modal-close" onclick="cerrarModal()">&times;</button>
        <div id="modal-body">
          <!-- Contenido inyectado dinámicamente -->
        </div>
      </div>
    </div>

  </main>

  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
