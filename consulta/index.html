<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Consulta de Calzado</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f3f4f6;
      color: #1f2937;
      display: flex;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* PRIMERA PARTE: Control e ingreso */
    .control-section {
      padding: 12px;
      background-color: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .search-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .search-input {
      flex: 2;
      min-width: 0;
      height: 44px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      border: 2px solid #d1d5db;
      border-radius: 8px;
      background-color: #ffffff;
      color: #111827;
      outline: none;
    }

    .search-input:focus {
      border-color: #2563eb;
    }

    .btn-search {
      flex: 1;
      min-width: 0;
      height: 44px;
      background-color: #2563eb;
      color: white;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }

    .btn-search:active {
      background-color: #1d4ed8;
    }

    .btn-clear {
      flex: 1;
      min-width: 0;
      height: 44px;
      background-color: #e5e7eb;
      color: #374151;
      font-weight: 700;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }

    .btn-clear:active {
      background-color: #d1d5db;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    .key-btn {
      height: 44px;
      font-size: 19px;
      font-weight: 700;
      background-color: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: #1f2937;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .key-btn:active {
      background-color: #e5e7eb;
      transform: scale(0.97);
    }

    .key-btn.alpha {
      background-color: #eff6ff;
      color: #1d4ed8;
      border-color: #bfdbfe;
    }

    .key-btn.backspace {
      background-color: #fee2e2;
      color: #dc2626;
      border-color: #fca5a5;
      font-size: 20px;
    }

    /* SEGUNDA PARTE: Tarjeta de resultados */
    .result-section {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .product-card {
      position: relative;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    /* Badge de Oferta */
    .badge-oferta {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #dc2626;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 4px rgba(220, 38, 38, 0.25);
      z-index: 2;
    }

    .product-image {
      width: 100%;
      max-height: 155px;
      object-fit: contain;
      border-radius: 8px;
      background-color: #f9fafb;
      margin-bottom: 8px;
    }

    .product-title {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 2px;
      text-align: center;
    }

    .info-row {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #e5e7eb;
    }

    .info-block {
      text-align: center;
    }

    .info-label {
      font-size: 10px;
      color: #6b7280;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 2px;
    }

    /* Estilos para precio regular y precio anterior tachado */
    .info-value-price-old {
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      text-decoration: line-through;
      line-height: 1;
      margin-bottom: 2px;
    }

    .info-value-price {
      font-size: 22px;
      font-weight: 800;
      color: #059669;
      line-height: 1.1;
    }

    .info-value-price.is-offer {
      color: #dc2626;
    }

    .info-value-price-sub {
      font-size: 14px;
      font-weight: 700;
      color: #2563eb;
      margin-top: 3px;
    }

    .info-value-stock {
      font-size: 15px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 12px;
      display: inline-block;
    }

    .stock-in { background-color: #f3f4f6; color: #6b7280; }
    .stock-out { background-color: #fee2e2; color: #991b1b; }

    .sizes-section {
      width: 100%;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #f3f4f6;
      text-align: center;
    }

    .sizes-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 6px;
    }

    .size-badge {
      min-width: 36px;
      height: 32px;
      padding: 0 8px;
      background-color: #d1fae5;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .placeholder-msg {
      margin: auto 0;
      color: #9ca3af;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="control-section">
    <div class="search-row">
      <input type="text" id="codeInput" class="search-input" placeholder="CÓDIGO" maxlength="5" readonly inputmode="none">
      <button class="btn-search" onclick="buscarProducto()">Buscar</button>
      <button class="btn-clear" onclick="limpiarConsulta()">Borrar</button>
    </div>

    <div class="keypad-grid">
      <button class="key-btn" onclick="pressKey('1')">1</button>
      <button class="key-btn" onclick="pressKey('2')">2</button>
      <button class="key-btn" onclick="pressKey('3')">3</button>

      <button class="key-btn" onclick="pressKey('4')">4</button>
      <button class="key-btn" onclick="pressKey('5')">5</button>
      <button class="key-btn" onclick="pressKey('6')">6</button>

      <button class="key-btn" onclick="pressKey('7')">7</button>
      <button class="key-btn" onclick="pressKey('8')">8</button>
      <button class="key-btn" onclick="pressKey('9')">9</button>

      <button class="key-btn alpha" onclick="pressKey('A')">A</button>
      <button class="key-btn alpha" onclick="pressKey('B')">B</button>
      <button class="key-btn" onclick="pressKey('0')">0</button>

      <button class="key-btn alpha" onclick="pressKey('Z')">Z</button>
      <button class="key-btn alpha" onclick="pressKey('N')">N</button>
      <button class="key-btn backspace" onclick="clearInput()">⌫</button>
    </div>
  </div>

  <div class="result-section" id="resultSection">
    <div class="placeholder-msg">
      Ingresa un código (máx. 5) y pulsa <b>Buscar</b>.
    </div>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7VDf2TT5oIua0vQSijNX7dagh77-F9Khjp46xFM6TrJnCMgJMJSR8aLaj4bIT8E0/exec";

  const inputEl = document.getElementById('codeInput');
  const resultEl = document.getElementById('resultSection');

  function pressKey(char) {
    if (inputEl.value.length < 5) {
      inputEl.value += char;
    }
  }

  function clearInput() {
    inputEl.value = inputEl.value.slice(0, -1);
  }

  function limpiarConsulta() {
    inputEl.value = '';
    resultEl.innerHTML = `
      <div class="placeholder-msg">
        Ingresa un código (máx. 5) y pulsa <b>Buscar</b>.
      </div>
    `;
  }

  function formatearUrlImagen(url) {
    if (!url || typeof url !== 'string') return '';
    url = url.trim();
    if (!url.startsWith('http')) return '';

    let fileId = null;

    if (url.includes('drive.google.com')) {
      const matchFile = url.match(/\/file\/d\/([^\/\?]+)/);
      if (matchFile && matchFile[1]) {
        fileId = matchFile[1];
      } else {
        const matchId = url.match(/id=([^&]+)/);
        if (matchId && matchId[1]) {
          fileId = matchId[1];
        }
      }
    }

    if (fileId) {
      return `https://lh3.googleusercontent.com/d/${fileId}`;
    }

    return url;
  }

  function formatearPrecio(precioRaw) {
    if (!precioRaw) return "S/ --";
    let numeroLimpio = String(precioRaw).replace(/[^0-9.-]/g, '');
    let num = parseFloat(numeroLimpio);

    if (isNaN(num)) return String(precioRaw);

    return "S/ " + num.toFixed(2);
  }

  async function buscarProducto() {
    const codigo = inputEl.value.trim().toUpperCase();
    if (!codigo) return;

    resultEl.innerHTML = `
      <div class="placeholder-msg">
        Consultando <b>${codigo}</b>...
      </div>
    `;

    try {
      const response = await fetch(`${SCRIPT_URL}?codigo=${encodeURIComponent(codigo)}`);
      const respuesta = await response.json();

      if (respuesta.encontrado) {
        const stockNum = parseInt(respuesta.stock) || 0;
        const stockClass = stockNum > 0 ? 'stock-in' : 'stock-out';
        const stockText = stockNum > 0 ? `${stockNum} pares` : 'Agotado';

        let tallasHTML = '';
        if (respuesta.tallas && respuesta.tallas.length > 0) {
          tallasHTML = respuesta.tallas.map(item => {
            if (typeof item === 'object' && item !== null) {
              const nombreTalla = item.talla || '';
              const cantidad = item.cantidad || 1;
              const contador = cantidad > 1 ? `<span style="font-size:13px; color:#2563eb; margin-left:3px; font-weight:800;">×${cantidad}</span>` : '';
              return `<span class="size-badge">${nombreTalla}${contador}</span>`;
            } 
            return `<span class="size-badge">${item}</span>`;
          }).join('');
        } else {
          tallasHTML = `<span style="font-size:13px; color:#dc2626; font-weight:600;">Agotado</span>`;
        }

        const urlFinalImagen = formatearUrlImagen(respuesta.imagen);
        const precioFormateado = formatearPrecio(respuesta.precio);

        // Lógica visual para la oferta
        const esOferta = respuesta.esOferta === true;
        const badgeOfertaHTML = esOferta ? `<div class="badge-oferta">Oferta</div>` : '';
        const precioAnteriorHTML = esOferta && respuesta.precioAnterior 
          ? `<div class="info-value-price-old">${formatearPrecio(respuesta.precioAnterior)}</div>` 
          : '';
        const clasePrecioFinal = esOferta ? 'info-value-price is-offer' : 'info-value-price';

        const imgHTML = urlFinalImagen 
          ? `<img src="${urlFinalImagen}" alt="Modelo ${respuesta.codigo}" class="product-image" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x300/f3f4f6/9ca3af?text=Imagen+no+disponible';">`
          : `<div class="product-image" style="display:flex; align-items:center; justify-content:center; color:#9ca3af; font-size:13px;">Sin Imagen</div>`;

        resultEl.innerHTML = `
          <div class="product-card">
            ${badgeOfertaHTML}
            ${imgHTML}
            <div class="product-title">Modelo: ${respuesta.codigo}</div>
            
            <div class="info-row">
              <div class="info-block">
                <div class="info-label">Precio</div>
                ${precioAnteriorHTML}
                <div class="${clasePrecioFinal}" id="precioElemento">${precioFormateado}</div>
                <div class="info-value-price-sub" id="precioTalla22Elemento" style="display: none;"></div>
              </div>
              <div class="info-block">
                <div class="info-label">Stock Total</div>
                <div class="info-value-stock ${stockClass}">${stockText}</div>
              </div>
            </div>

            <div class="sizes-section">
              <div class="info-label">Tallas Disponibles</div>
              <div class="sizes-container">
                ${tallasHTML}
              </div>
            </div>

          </div>
        `;

        // Renderizado dinámico de la Talla 22
        const elemTalla22 = document.getElementById("precioTalla22Elemento");
        if (elemTalla22) {
          if (respuesta.precioTalla22) {
            const precioT22Formateado = formatearPrecio(respuesta.precioTalla22);
            elemTalla22.innerText = `(${precioT22Formateado} Talla 22)`;
            elemTalla22.style.display = "block";
          } else {
            elemTalla22.style.display = "none";
          }
        }

      } else {
        resultEl.innerHTML = `
          <div class="placeholder-msg" style="color: #dc2626; font-weight: 600;">
            Código "${codigo}" no encontrado.
          </div>
        `;
      }
    } catch (error) {
      console.error(error);
      resultEl.innerHTML = `
        <div class="placeholder-msg" style="color: #dc2626;">
          Error de conexión al consultar los datos.
        </div>
      `;
    }
  }
</script>

</body>
</html>
